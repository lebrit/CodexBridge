name: Build and publish Windows package

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codexbridge-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up restic migration lab
        shell: pwsh
        run: |
          $restic = Get-Command restic -ErrorAction SilentlyContinue
          if (-not $restic) {
            winget install --exact --id restic.restic --scope User `
              --accept-package-agreements --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw 'winget could not install restic.' }

            $restic = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet" `
              -Filter restic.exe -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $restic) { throw 'restic.exe was not found after installation.' }
            Split-Path -Parent $restic.FullName | Add-Content -LiteralPath $env:GITHUB_PATH
            $resticPath = $restic.FullName
          }
          else {
            $resticPath = $restic.Source
          }
          & $resticPath version

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $baseVersion = [string]$props.Project.PropertyGroup.VersionPrefix
          $version = "$baseVersion-build.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test and package
        shell: pwsh
        run: .\scripts\Build-Release.ps1 -Version "${{ steps.version.outputs.version }}" -RequireResticIntegration -RequireInstaller

      - name: Test clean Windows install, update and uninstall
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $baselineVersion = '0.0.0-ci-baseline'
          $baselineDirectory = Join-Path $env:RUNNER_TEMP 'CodexBridge-baseline-installer'
          .\scripts\Build-Installer.ps1 `
            -Version $baselineVersion `
            -SourceDirectory .\artifacts\publish\win-x64 `
            -OutputDirectory $baselineDirectory `
            -Require
          $baseline = Join-Path $baselineDirectory "CodexBridge-$baselineVersion-setup.exe"
          $current = (Get-ChildItem .\artifacts\CodexBridge-*-setup.exe -File -ErrorAction Stop).FullName
          .\scripts\Test-InstallerAcceptance.ps1 `
            -BaselineSetupPath $baseline `
            -BaselineVersion $baselineVersion `
            -CurrentSetupPath $current `
            -ExpectedVersion $env:VERSION

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: CodexBridge-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/CodexBridge-*.zip
            artifacts/CodexBridge-*-setup.exe
            artifacts/CodexBridge-*.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish versioned prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = (Get-ChildItem artifacts\CodexBridge-*.zip -File).FullName
          $setup = (Get-ChildItem artifacts\CodexBridge-*-setup.exe -File).FullName
          $hashes = (Get-ChildItem artifacts\CodexBridge-*.sha256 -File).FullName
          $assets = @($zip, $setup) + $hashes
          $tag = "v$env:VERSION"
          $notes = @"
          Automatic Windows x64 build from $env:GITHUB_SHA. Includes unit tests, the isolated restic migration lab, public-safety validation, and a clean-runner install/update/uninstall acceptance test. The installer preserves the per-user CodexBridge data directory during updates and uninstall.

          Code signing policy: https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/CODE_SIGNING_POLICY.md

          This build is unsigned unless both these release notes and its Authenticode signature prove otherwise. The SignPath Foundation application was not approved because the project does not yet meet the program's public-visibility requirements.
          "@
          $published = $false
          for ($attempt = 1; $attempt -le 3 -and -not $published; $attempt++) {
            gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $assets --clobber --repo "$env:GITHUB_REPOSITORY"
              if ($LASTEXITCODE -eq 0) {
                gh release edit $tag `
                  --repo "$env:GITHUB_REPOSITORY" `
                  --title "CodexBridge $env:VERSION" `
                  --notes $notes `
                  --prerelease
              }
            }
            else {
              gh release create $tag $assets `
                --repo "$env:GITHUB_REPOSITORY" `
                --target "$env:GITHUB_SHA" `
                --title "CodexBridge $env:VERSION" `
                --notes $notes `
                --prerelease
            }

            $published = $LASTEXITCODE -eq 0
            if (-not $published -and $attempt -lt 3) {
              Write-Warning "Release publication attempt $attempt failed; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if (-not $published) { throw "Could not publish $tag after three attempts." }
