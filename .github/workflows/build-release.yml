name: Build and publish Windows package

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexbridge-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up restic migration lab
        shell: pwsh
        run: |
          $restic = Get-Command restic -ErrorAction SilentlyContinue
          if (-not $restic) {
            winget install --exact --id restic.restic --scope User `
              --accept-package-agreements --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw 'winget could not install restic.' }

            $restic = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet" `
              -Filter restic.exe -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $restic) { throw 'restic.exe was not found after installation.' }
            Split-Path -Parent $restic.FullName | Add-Content -LiteralPath $env:GITHUB_PATH
            $resticPath = $restic.FullName
          }
          else {
            $resticPath = $restic.Source
          }
          & $resticPath version

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $baseVersion = [string]$props.Project.PropertyGroup.VersionPrefix
          $version = "$baseVersion-build.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test and package
        shell: pwsh
        run: .\scripts\Build-Release.ps1 -Version "${{ steps.version.outputs.version }}" -RequireResticIntegration -RequireInstaller

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: CodexBridge-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/CodexBridge-*.zip
            artifacts/CodexBridge-*-setup.exe
            artifacts/CodexBridge-*.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload synthetic GUI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-build-${{ github.run_number }}
          path: artifacts/ui-smoke-*/
          retention-days: 14

  acceptance:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: CodexBridge-${{ needs.build.outputs.version }}-win-x64
          path: artifacts

      - name: Verify packages and test real previous-release upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $baselineVersion = '0.9.0-build.26.1'
          $baselineDirectory = Join-Path $env:RUNNER_TEMP 'CodexBridge-baseline'
          New-Item -ItemType Directory -Path $baselineDirectory | Out-Null
          gh release download "v$baselineVersion" --repo "$env:GITHUB_REPOSITORY" `
            --pattern "CodexBridge-$baselineVersion-setup.exe" --dir $baselineDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous release.' }
          $baseline = Join-Path $baselineDirectory "CodexBridge-$baselineVersion-setup.exe"
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6e297778549fbc656e18a0f07a5cccc6e152cacd1d457c2775e63d7bd6f6d398') {
            throw 'Previous-release checksum mismatch.'
          }
          foreach ($file in Get-ChildItem artifacts\*.sha256) {
            $parts = (Get-Content $file.FullName -Raw).Trim() -split '\s+', 2
            $package = Join-Path artifacts $parts[1]
            if ((Get-FileHash $package -Algorithm SHA256).Hash -ne $parts[0]) { throw 'Package checksum mismatch.' }
          }
          .\scripts\Test-InstallerAcceptance.ps1 `
            -BaselineSetupPath $baseline -BaselineVersion $baselineVersion `
            -CurrentSetupPath ".\artifacts\CodexBridge-$env:VERSION-setup.exe" `
            -ExpectedVersion $env:VERSION

      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.os }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/CodexBridge-*.log
            ${{ runner.temp }}/CodexBridge-ui-smoke/
          retention-days: 14

  publish:
    needs: [build, acceptance]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CodexBridge-${{ needs.build.outputs.version }}-win-x64
          path: artifacts

      - name: Publish versioned prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $zip = (Get-ChildItem artifacts\CodexBridge-*.zip -File).FullName
          $setup = (Get-ChildItem artifacts\CodexBridge-*-setup.exe -File).FullName
          $hashes = (Get-ChildItem artifacts\CodexBridge-*.sha256 -File).FullName
          $assets = @($zip, $setup) + $hashes
          $tag = "v$env:VERSION"
          $notes = @"
          Automatic Windows x64 build from $env:GITHUB_SHA. Includes unit tests, the isolated restic migration lab, public-safety validation, 30 synthetic GUI render checks, and independent Windows Server 2022/2025 install/update/uninstall acceptance jobs. Upgrade uses the published 0.9.0 installer. User data and scheduled tasks owned by other installations are preserved.

          Code signing policy: https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/CODE_SIGNING_POLICY.md

          This build is unsigned unless both these release notes and its Authenticode signature prove otherwise. The SignPath Foundation application was not approved because the project does not yet meet the program's public-visibility requirements.
          "@
          $published = $false
          for ($attempt = 1; $attempt -le 3 -and -not $published; $attempt++) {
            gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $assets --clobber --repo "$env:GITHUB_REPOSITORY"
              if ($LASTEXITCODE -eq 0) {
                gh release edit $tag `
                  --repo "$env:GITHUB_REPOSITORY" `
                  --title "CodexBridge $env:VERSION" `
                  --notes $notes `
                  --prerelease
              }
            }
            else {
              gh release create $tag $assets `
                --repo "$env:GITHUB_REPOSITORY" `
                --target "$env:GITHUB_SHA" `
                --title "CodexBridge $env:VERSION" `
                --notes $notes `
                --prerelease
            }

            $published = $LASTEXITCODE -eq 0
            if (-not $published -and $attempt -lt 3) {
              Write-Warning "Release publication attempt $attempt failed; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if (-not $published) { throw "Could not publish $tag after three attempts." }
